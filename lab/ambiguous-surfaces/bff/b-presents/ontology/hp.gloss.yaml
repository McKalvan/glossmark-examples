# ontology/hp.gloss.yaml: the core tier, what a Harbor Provisions account manager recognises.
namespace: hp
version: 0.1.0
concepts:
  OrderPlacement:
    kind: process
    criticality: high
    doc: "A customer places an order for delivery against their account."
  CreditLimit:
    kind: constraint
    criticality: critical
    constrains: OrderPlacement
    doc: "A customer's open balance plus a new order may not exceed the credit limit finance set for them."
