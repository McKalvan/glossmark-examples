# hirehq repository, mid-split: owns the core hire: namespace and the monolith's hq:.
# It imports the invoicing service's inv: only so that hq:InvoiceGenerator's
# replaced-by can name inv:InvoiceRun; the service imports hire: back (a cycle).
grammar: 1
owns:
  hire: { iri: https://onto.brightwater.example/hire/, file: ontology/hire.gloss.yaml, tier: core,           version: 1.0.0, owner: hire-product }
  hq:   { iri: https://onto.brightwater.example/hq/,   file: ontology/hq.gloss.yaml,   tier: implementation, version: 1.1.0, owner: hirehq-eng }
imports:
  inv:  { iri: https://onto.brightwater.example/inv/, tier: implementation, version: "^0.1", source: ../invoicing-service/ontology/inv.gloss.yaml }
prefixes:
  bw: https://arch.brightwater.example/boundaries/
