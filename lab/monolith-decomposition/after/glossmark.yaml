  hq:   { iri: https://onto.brightwater.example/hq/,   file: ontology/hq.gloss.yaml,   tier: implementation, version: 1.1.1, owner: hirehq-eng }
  inv:  { iri: https://onto.brightwater.example/inv/,  file: ontology/inv.gloss.yaml,  tier: implementation, version: 1.0.0, owner: invoicing-eng }
prefixes:
  bw: https://arch.brightwater.example/boundaries/
